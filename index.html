<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat - Gaming Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { position: fixed; width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        
        #authModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #121218; width: 100%; max-width: 320px; border-radius: 20px; padding: 24px; text-align: center; border: 1px solid rgba(250, 204, 21, 0.4); box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .auth-input { width: 100%; background: #000; border: 1px solid #333; border-radius: 10px; padding: 14px; color: #fff; margin: 20px 0; font-size: 16px; text-align: center; outline: none; }
        .auth-btn { width: 100%; padding: 14px; border-radius: 10px; background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%); color: #000; font-weight: 900; border: none; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        
        .profile-badge { position: fixed; top: 15px; left: 15px; background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(10px); padding: 8px 14px; border-radius: 20px; color: #fff; font-size: 12px; font-weight: 800; z-index: 5; border: 1px solid rgba(255,255,255,0.15); transition: opacity 0.3s; display: flex; align-items: center; gap: 8px; }
        .profile-badge.hide { opacity: 0; pointer-events: none; }
        .lvl-circle { background: #facc15; color: #000; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; }
        .xp-bar-container { width: 60px; height: 4px; background: #333; border-radius: 2px; margin-top: 2px; overflow: hidden; }
        .xp-bar { height: 100%; background: #3b82f6; width: 0%; transition: width 0.4s ease; }

        #slider { display: flex; width: 500vw; height: 100vh; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .frame-wrapper { width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; background: #07070a; }

        .tab-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 96%; max-width: 420px; height: 60px; background: rgba(18, 18, 22, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px; display: flex; justify-content: space-between; padding: 0 4px; z-index: 10000; transition: transform 0.4s ease, opacity 0.4s ease; }
        .tab-bar.hide { transform: translateX(-50%) translateY(120px); opacity: 0; pointer-events: none; }
        
        .indicator { position: absolute; top: 6px; bottom: 6px; width: calc(20% - 6px); left: 4px; background: rgba(239, 68, 68, 0.25); border-radius: 24px; transition: 0.4s; z-index: 1; }
        .tab-btn { flex: 1; height: 100%; border: none; background: transparent; color: rgba(255,255,255,0.4); font-size: 9px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; z-index: 2; transition: 0.3s; text-transform: uppercase; cursor: pointer; }
        .tab-btn.active { color: #fff; }

        #toast { position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-120px); background: rgba(20, 8, 8, 0.95); border: 1px solid rgba(250, 204, 21, 0.6); color: #fef08a; padding: 12px 20px; border-radius: 20px; font-size: 13px; font-weight: 900; z-index: 100000; display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="authModal">
        <div class="auth-card">
            <i class="fa-solid fa-crown" style="font-size: 40px; color: #facc15; margin-bottom: 10px;"></i>
            <h2 style="color: #fff; font-size: 20px;">Create Profile</h2>
            <p style="color: #94a3b8; font-size: 12px; margin-top: 5px;">Track your wins and level up locally.</p>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Enter Username" autocomplete="off">
            <button class="auth-btn" onclick="saveProfile()">Start Playing</button>
        </div>
    </div>

    <div class="profile-badge" id="profileBadge" style="display: none;"></div>
    <div id="toast"><i class="fa-solid fa-trophy" style="color: #facc15;"></i> <span id="toastMsg"></span></div>

    <div id="slider">
        <div class="frame-wrapper"><div style="color:#fff;text-align:center;padding-top:50vh;">Movies</div></div>
        <div class="frame-wrapper"><div style="color:#fff;text-align:center;padding-top:50vh;">Golden</div></div>
        <div class="frame-wrapper"><div style="color:#fff;text-align:center;padding-top:50vh;">Audio</div></div>
        <div class="frame-wrapper"><div style="color:#fff;text-align:center;padding-top:50vh;">Ludo</div></div>
        <div class="frame-wrapper"><iframe id="carromFrame" src="./carrom.html"></iframe></div>
    </div>

    <nav class="tab-bar" id="tabBar">
        <div class="indicator" id="indicator" style="left: calc(80% - 4px); background: rgba(245, 158, 11, 0.25);"></div>
        <button class="tab-btn" onclick="switchTab(0, '#ef4444')"><i class="fa-solid fa-film"></i><span>Movies</span></button>
        <button class="tab-btn" onclick="switchTab(1, '#fbbf24')"><i class="fa-brands fa-youtube"></i><span>Golden</span></button>
        <button class="tab-btn" onclick="switchTab(2, '#a855f7')"><i class="fa-solid fa-compact-disc"></i><span>Audio</span></button>
        <button class="tab-btn" onclick="switchTab(3, '#ef4444')"><i class="fa-solid fa-chess-board"></i><span>Ludo</span></button>
        <button class="tab-btn active" style="color:#fff;" onclick="switchTab(4, '#f59e0b')"><i class="fa-solid fa-bullseye"></i><span>Carrom</span></button>
    </nav>

    <script>
        let playerProfile = JSON.parse(localStorage.getItem('syncbeat_profile'));
        let isGameActive = false;

        document.getElementById('slider').style.transform = `translateX(-400vw)`; 

        if (playerProfile) {
            document.getElementById('authModal').style.display = 'none';
            loadProfileUI();
            distributeProfile();
        }

        function saveProfile() {
            const name = document.getElementById('usernameInput').value.trim();
            if (!name) return alert('Enter a username');
            
            playerProfile = { 
                id: 'UID-' + Math.random().toString(36).substr(2, 9).toUpperCase(), 
                name: name,
                level: 1,
                xp: 0,
                wins: 0
            };
            localStorage.setItem('syncbeat_profile', JSON.stringify(playerProfile));
            document.getElementById('authModal').style.display = 'none';
            loadProfileUI();
            distributeProfile();
        }

        function showToastMessage(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function addWinExperience() {
            if(!playerProfile.wins) playerProfile.wins = 0;
            if(!playerProfile.xp) playerProfile.xp = 0;
            if(!playerProfile.level) playerProfile.level = 1;

            playerProfile.wins += 1;
            playerProfile.xp += 50; 
            
            let xpNeeded = playerProfile.level * 100;
            let leveledUp = false;

            if (playerProfile.xp >= xpNeeded) {
                playerProfile.xp -= xpNeeded;
                playerProfile.level += 1;
                leveledUp = true;
            }

            localStorage.setItem('syncbeat_profile', JSON.stringify(playerProfile));
            loadProfileUI();
            distributeProfile();

            if (leveledUp) {
                setTimeout(() => showToastMessage(`Level Up! You are now Level ${playerProfile.level}`), 500);
            } else {
                setTimeout(() => showToastMessage(`Victory! +50 XP`), 500);
            }
        }

        function loadProfileUI() {
            const badge = document.getElementById('profileBadge');
            badge.style.display = 'flex';
            
            let xpNeeded = playerProfile.level * 100;
            let xpPercent = (playerProfile.xp / xpNeeded) * 100;

            badge.innerHTML = `
                <div class="lvl-circle">${playerProfile.level || 1}</div>
                <div style="display:flex; flex-direction:column;">
                    <span>${playerProfile.name} <span style="color:#94a3b8; font-size:9px; margin-left:4px;">${playerProfile.id}</span></span>
                    <div class="xp-bar-container"><div class="xp-bar" style="width: ${xpPercent}%"></div></div>
                </div>
            `;
        }

        function distributeProfile() {
            setTimeout(() => {
                const carromWin = document.getElementById('carromFrame').contentWindow;
                if (carromWin) carromWin.postMessage({ type: 'AUTH', profile: playerProfile }, '*');
            }, 1000);
        }

        window.addEventListener('message', (e) => {
            if (e.data.sender !== 'syncbeat') return;
            const tabBar = document.getElementById('tabBar');
            const profileBadge = document.getElementById('profileBadge');
            
            if (e.data.action === 'GAME_STARTED') {
                isGameActive = true;
                tabBar.classList.add('hide');
                profileBadge.classList.add('hide');
            } else if (e.data.action === 'GAME_ENDED') {
                isGameActive = false;
                tabBar.classList.remove('hide');
                profileBadge.classList.remove('hide');
            } else if (e.data.action === 'MATCH_WON') {
                addWinExperience();
            }
        });

        function switchTab(index, color) {
            if (isGameActive) {
                showToastMessage(`Match in progress. Please Quit match first!`);
                return;
            }

            document.getElementById('slider').style.transform = `translateX(-${index * 100}vw)`;
            const pos = ['4px', 'calc(20% + 1px)', 'calc(40% - 1px)', 'calc(60% - 3px)', 'calc(80% - 4px)'];
            document.getElementById('indicator').style.left = pos[index];
            document.getElementById('indicator').style.background = color + '40';
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
                btn.style.color = i === index ? '#fff' : 'rgba(255,255,255,0.4)';
            });
        }
    </script>
</body>
</html>
