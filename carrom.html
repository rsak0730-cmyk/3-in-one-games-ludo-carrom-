<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat Carrom Pro - Local 2-Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100vw; height: 100vh; background: #120c1f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 10px 0; }

        /* Top HUD / Scoreboard */
        .hud-top { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; z-index: 10; }
        .player-card { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); min-width: 130px; transition: all 0.3s ease; }
        .player-card.active-turn { border-color: #facc15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); background: rgba(250, 204, 21, 0.1); }
        .player-avatar { width: 32px; height: 32px; border-radius: 50%; background: #facc15; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; color: #000; border: 2px solid #fff; }
        .player-info { display: flex; flex-direction: column; }
        .player-name { font-size: 11px; font-weight: 900; color: #f3f4f6; }
        .player-score { font-size: 10px; color: #cbd5e1; font-weight: 700; }
        
        .turn-banner { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 900; color: #facc15; text-align: center; backdrop-filter: blur(5px); }

        /* Board Container */
        .board-container { position: relative; width: 92vw; height: 92vw; max-width: 380px; max-height: 380px; display: flex; align-items: center; justify-content: center; }
        canvas { background: #deb887; border: 18px solid #5c3a21; border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.2); width: 100%; height: 100%; }

        /* Bottom Controls / Baseline Slider */
        .hud-bottom { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px; z-index: 10; }
        .striker-control-bar { width: 85%; max-width: 320px; height: 36px; background: rgba(0,0,0,0.5); border-radius: 18px; border: 1px solid rgba(255,255,255,0.2); position: relative; display: flex; align-items: center; padding: 0 12px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
        .control-knob { position: absolute; width: 28px; height: 28px; background: radial-gradient(circle, #facc15 0%, #ca8a04 100%); border-radius: 50%; top: 3px; left: calc(50% - 14px); cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }

        .action-buttons { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .btn-icon { width: 42px; height: 42px; background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%); border: none; border-radius: 50%; color: #000; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #fef08a; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn-icon:active { transform: scale(0.92); }

        /* Toast notifications */
        #toast { position: fixed; top: 75px; left: 50%; transform: translateX(-50%) translateY(-50px); background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(250, 204, 21, 0.5); color: #fef08a; padding: 8px 16px; border-radius: 16px; font-size: 12px; font-weight: 800; z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Game Over / Win Overlay */
        #winModal { position: fixed; inset: 0; background: rgba(10, 5, 20, 0.9); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .win-card { background: #1e1b4b; width: 100%; max-width: 320px; border-radius: 24px; padding: 24px; border: 2px solid #facc15; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .btn-restart { width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer; border: none; background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%); color: #000; text-transform: uppercase; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="toast">Foul: Striker pocketed!</div>

    <div class="hud-top">
        <div class="player-card active-turn" id="p1Card">
            <div class="player-avatar" style="background:#f8fafc; color:#0f172a;">P1</div>
            <div class="player-info">
                <span class="player-name">Player 1 (White)</span>
                <span class="player-score">Coins: <span id="p1Count">9</span></span>
            </div>
        </div>
        <div class="turn-banner" id="turnBanner">P1's Turn</div>
        <div class="player-card" id="p2Card">
            <div class="player-avatar" style="background:#1e293b; color:#fff;">P2</div>
            <div class="player-info">
                <span class="player-name">Player 2 (Black)</span>
                <span class="player-score">Coins: <span id="p2Count">9</span></span>
            </div>
        </div>
    </div>

    <div class="board-container">
        <canvas id="carromCanvas" width="400" height="400"></canvas>
    </div>

    <div class="hud-bottom">
        <div class="striker-control-bar" id="sliderBar">
            <div class="control-knob" id="controlKnob"></div>
        </div>
        <div class="action-buttons">
            <button class="btn-icon" onclick="resetBoard()" title="Restart Match"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="btn-icon" style="background:linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color:#fff; border-color:#fca5a5;" onclick="quitToHome()" title="Exit Match"><i class="fa-solid fa-power-off"></i></button>
            <button class="btn-icon" onclick="toggleSound()" id="soundBtn" title="Toggle Sound"><i class="fa-solid fa-volume-high"></i></button>
        </div>
    </div>

    <div id="winModal">
        <div class="win-card">
            <i class="fa-solid fa-trophy" style="font-size: 48px; color: #facc15; margin-bottom: 12px;"></i>
            <h2 id="winTitle" style="font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 8px;">Player 1 Wins!</h2>
            <p id="winDesc" style="font-size: 12px; color: #cbd5e1; margin-bottom: 15px;">All coins successfully pocketed and covered.</p>
            <button class="btn-restart" onclick="resetBoard()">Play Again</button>
        </div>
    </div>

    <script>
        // --- Web Audio API Sound Synthesizer ---
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'pocket') {
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'shoot') {
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(280, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        function quitToHome() {
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_CLOSED' }, '*');
        }

        // --- Game State & Physics Engine ---
        const cvs = document.getElementById('carromCanvas');
        const ctx = cvs.getContext('2d');

        let coins = [];
        let striker = { id: 'striker', c: '#fffbeb', x: 200, y: 310, r: 13, vx: 0, vy: 0, mass: 1.8, active: true };
        
        let turn = 1; // 1 for Player 1 (White), 2 for Player 2 (Black)
        let p1Score = 9;
        let p2Score = 9;
        let queenCoverNeeded = false; // true if queen was pocketed and needs a cover coin
        let shotTaken = false;
        let pocketedThisShot = [];

        function resetBoard() {
            document.getElementById('winModal').style.display = 'none';
            turn = 1; p1Score = 9; p2Score = 9; queenCoverNeeded = false;
            updateHUD();
            initPieces();
        }

        function initPieces() {
            coins = [{ id: 'queen', c: '#dc2626', x: 200, y: 200, r: 9, vx: 0, vy: 0, mass: 1, active: true, type: 'queen' }];
            // 9 White coins, 9 Black coins arranged in standard star pattern
            for (let i = 0; i < 6; i++) {
                let angle = i * (Math.PI / 3);
                coins.push({ id: `w_${i}`, c: '#fdfbf7', x: 200 + Math.cos(angle)*20, y: 200 + Math.sin(angle)*20, r: 9, vx: 0, vy: 0, mass: 1, active: true, type: 'white' });
            }
            for (let i = 0; i < 6; i++) {
                let angle = i * (Math.PI / 6);
                let color = i % 2 === 0 ? '#1e293b' : '#fdfbf7';
                let type = i % 2 === 0 ? 'black' : 'white';
                coins.push({ id: `b_${i}`, c: color, x: 200 + Math.cos(angle)*40, y: 200 + Math.sin(angle)*40, r: 9, vx: 0, vy: 0, mass: 1, active: true, type: type });
            }
            // Add remaining 3 white and 3 black coins to complete 9 of each
            let extraAngles = [0, (2*Math.PI)/3, (4*Math.PI)/3];
            for (let i = 0; i < 3; i++) {
                coins.push({ id: `w_ex_${i}`, c: '#fdfbf7', x: 200 + Math.cos(extraAngles[i])*55, y: 200 + Math.sin(extraAngles[i])*55, r: 9, vx: 0, vy: 0, mass: 1, active: true, type: 'white' });
                coins.push({ id: `b_ex_${i}`, c: '#1e293b', x: 200 + Math.cos(extraAngles[i] + 0.5)*55, y: 200 + Math.sin(extraAngles[i] + 0.5)*55, r: 9, vx: 0, vy: 0, mass: 1, active: true, type: 'black' });
            }
            resetStriker();
        }

        function resetStriker() {
            striker.x = 200;
            striker.y = turn === 1 ? 310 : 90;
            striker.vx = 0; striker.vy = 0;
            striker.active = true;
            document.getElementById('controlKnob').style.left = 'calc(50% - 14px)';
        }

        function updateHUD() {
            document.getElementById('p1Count').innerText = p1Score;
            document.getElementById('p2Count').innerText = p2Score;
            const p1Card = document.getElementById('p1Card');
            const p2Card = document.getElementById('p2Card');
            const banner = document.getElementById('turnBanner');

            if (turn === 1) {
                p1Card.classList.add('active-turn');
                p2Card.classList.remove('active-turn');
                banner.innerText = "P1's Turn (White)";
            } else {
                p2Card.classList.add('active-turn');
                p1Card.classList.remove('active-turn');
                banner.innerText = "P2's Turn (Black)";
            }
        }

        // --- Baseline Slider Controls ---
        const sliderBar = document.getElementById('sliderBar');
        const knob = document.getElementById('controlKnob');
        let isSliding = false;

        sliderBar.addEventListener('pointerdown', (e) => { isSliding = true; updateStrikerPos(e); });
        window.addEventListener('pointermove', (e) => { if (isSliding) updateStrikerPos(e); });
        window.addEventListener('pointerup', () => isSliding = false);

        function updateStrikerPos(e) {
            if (isMoving()) return; // Can't move striker while board is in motion
            const rect = sliderBar.getBoundingClientRect();
            let pos = (e.clientX - rect.left) / rect.width;
            pos = Math.max(0.1, Math.min(0.9, pos));
            knob.style.left = `calc(${pos * 100}% - 14px)`;
            striker.x = 120 + pos * 160;
        }

        // --- Slingshot Aim & Shoot ---
        let isDragging = false;
        let startX, startY;
        let dragCurrentX, dragCurrentY;

        cvs.addEventListener('pointerdown', (e) => {
            if (isMoving()) return;
            const rect = cvs.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (cvs.width / rect.width);
            const clickY = (e.clientY - rect.top) * (cvs.height / rect.height);
            
            if (Math.hypot(clickX - striker.x, striker.y - clickY) < 30) {
                isDragging = true;
                startX = clickX; startY = clickY;
                dragCurrentX = clickX; dragCurrentY = clickY;
            }
        });

        cvs.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const rect = cvs.getBoundingClientRect();
            dragCurrentX = (e.clientX - rect.left) * (cvs.width / rect.width);
            dragCurrentY = (e.clientY - rect.top) * (cvs.height / rect.height);
        });

        cvs.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;
            
            // Calculate pull-back vector
            let dx = dragCurrentX - startX;
            let dy = dragCurrentY - startY;
            let power = Math.hypot(dx, dy);
            if (power > 5) {
                let maxPower = 120;
                let scale = Math.min(power, maxPower) / maxPower;
                // Shoot in opposite direction of drag
                striker.vx = (-dx / power) * scale * 18;
                striker.vy = (-dy / power) * scale * 18;
                shotTaken = true;
                pocketedThisShot = [];
                playSound('shoot');
            }
        });

        function isMoving() {
            if (Math.abs(striker.vx) > 0.02 || Math.abs(striker.vy) > 0.02) return true;
            for (let c of coins) {
                if (c.active && (Math.abs(c.vx) > 0.02 || Math.abs(c.vy) > 0.02)) return true;
            }
            return false;
        }

        // --- Rigid Body Physics & Collisions ---
        function resolveCollision(a, b) {
            if (!a.active || !b.active) return;
            let dx = b.x - a.x; let dy = b.y - a.y; let dist = Math.hypot(dx, dy);
            if (dist < a.r + b.r) {
                let overlap = (a.r + b.r - dist) / 2;
                let nx = dx / dist, ny = dy / dist;
                a.x -= nx * overlap; a.y -= ny * overlap;
                b.x += nx * overlap; b.y += ny * overlap;
                let kx = b.vx - a.vx; let ky = b.vy - a.vy;
                let p = 2 * (nx * kx + ny * ky) / (a.mass + b.mass);
                a.vx += p * b.mass * nx; a.vy += p * b.mass * ny;
                b.vx -= p * a.mass * nx; b.vy -= p * a.mass * ny;
                playSound('hit');
            }
        }

        const pockets = [[22,22], [378,22], [22,378], [378,378]];

        function updatePhysics() {
            // Apply friction
            if (Math.abs(striker.vx) > 0.01 || Math.abs(striker.vy) > 0.01) {
                striker.vx *= 0.982; striker.vy *= 0.982;
                striker.x += striker.vx; striker.y += striker.vy;
                // Wall Bounce
                if (striker.x < striker.r + 6 || striker.x > cvs.width - striker.r - 6) { striker.vx *= -0.75; striker.x = Math.max(striker.r + 6, Math.min(cvs.width - striker.r - 6, striker.x)); playSound('hit'); }
                if (striker.y < striker.r + 6 || striker.y > cvs.height - striker.r - 6) { striker.vy *= -0.75; striker.y = Math.max(striker.r + 6, Math.min(cvs.height - striker.r - 6, striker.y)); playSound('hit'); }
            }

            for (let i = 0; i < coins.length; i++) {
                let c = coins[i];
                if (!c.active) continue;
                if (Math.abs(c.vx) > 0.01 || Math.abs(c.vy) > 0.01) {
                    c.vx *= 0.982; c.vy *= 0.982;
                    c.x += c.vx; c.y += c.vy;
                    if (c.x < c.r + 6 || c.x > cvs.width - c.r - 6) { c.vx *= -0.75; c.x = Math.max(c.r + 6, Math.min(cvs.width - c.r - 6, c.x)); playSound('hit'); }
                    if (c.y < c.r + 6 || c.y > cvs.height - c.r - 6) { c.vy *= -0.75; c.y = Math.max(c.r + 6, Math.min(cvs.height - c.r - 6, c.y)); playSound('hit'); }
                }
                resolveCollision(striker, c);
                for (let j = i + 1; j < coins.length; j++) resolveCollision(c, coins[j]);
            }

            // Check Pocketing
            coins.forEach(c => {
                if (!c.active) return;
                pockets.forEach(p => {
                    if (Math.hypot(c.x - p[0], c.y - p[1]) < 16) {
                        c.active = false; c.vx = 0; c.vy = 0;
                        pocketedThisShot.push(c);
                        playSound('pocket');
                    }
                });
            });

            // Check Striker Pocketed (Foul)
            pockets.forEach(p => {
                if (striker.active && Math.hypot(striker.x - p[0], striker.y - p[1]) < 18) {
                    striker.active = false;
                    striker.vx = 0; striker.vy = 0;
                    showToast("Foul: Striker pocketed!");
                    playSound('pocket');
                }
            });

            // Handle turn resolution when all motion stops
            if (shotTaken && !isMoving()) {
                resolveTurn();
            }
        }

        function resolveTurn() {
            shotTaken = false;
            let keepTurn = false;
            let foul = !striker.active;

            // If striker went in, return any pocketed coin of opponent or penalty
            if (!striker.active) {
                pocketedThisShot.forEach(pc => {
                    if (pc.type === (turn === 1 ? 'white' : 'black')) {
                        pc.active = true; // return pocketed coin
                        pc.x = 200; pc.y = 200;
                    }
                });
            } else {
                // Evaluate pocketed coins
                pocketedThisShot.forEach(pc => {
                    if (pc.type === 'white') {
                        if (turn === 1) { p1Score--; keepTurn = true; }
                        else { p2Score--; } // opponent scored
                    } else if (pc.type === 'black') {
                        if (turn === 2) { p2Score--; keepTurn = true; }
                        else { p1Score--; }
                    } else if (pc.type === 'queen') {
                        queenCoverNeeded = true;
                        showToast("Queen pocketed! Must cover next.");
                        keepTurn = true;
                    }
                });

                // Check Queen Cover rule
                if (queenCoverNeeded && pocketedThisShot.length > 0) {
                    let covered = pocketedThisShot.some(pc => pc.type === (turn === 1 ? 'white' : 'black'));
                    if (covered) {
                        queenCoverNeeded = false;
                        showToast("Queen covered successfully!");
                    }
                }
            }

            resetStriker();

            // Check Win Condition
            if (p1Score <= 0) {
                document.getElementById('winTitle').innerText = "Player 1 Wins!";
                document.getElementById('winModal').style.display = 'flex';
                return;
            } else if (p2Score <= 0) {
                document.getElementById('winTitle').innerText = "Player 2 Wins!";
                document.getElementById('winModal').style.display = 'flex';
                return;
            }

            // Switch turn if no legal coin pocketed
            if (!keepTurn || foul) {
                turn = turn === 1 ? 2 : 1;
            }
            updateHUD();
        }

        // --- Canvas Rendering ---
        function drawBoard() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            // Center Ring & Artwork
            ctx.beginPath(); ctx.arc(200, 200, 38, 0, Math.PI*2); ctx.strokeStyle = 'rgba(92, 58, 33, 0.35)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(200, 200, 12, 0, Math.PI*2); ctx.fillStyle = 'rgba(92, 58, 33, 0.2)'; ctx.fill();

            // Pockets
            pockets.forEach(p => {
                ctx.beginPath(); ctx.arc(p[0], p[1], 16, 0, Math.PI*2); ctx.fillStyle = '#050505'; ctx.fill();
                ctx.strokeStyle = '#18181b'; ctx.lineWidth = 3; ctx.stroke();
            });

            // Base Lines & Striker Circles
            ctx.strokeStyle = 'rgba(220, 38, 38, 0.5)'; ctx.lineWidth = 1.5;
            [ [200, 310, 30], [200, 90, 30] ].forEach(b => {
                ctx.beginPath(); ctx.arc(b[0], b[1], b[2], 0, Math.PI*2); ctx.stroke();
            });

            // Coins
            coins.forEach(c => {
                if (!c.active) return;
                ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fillStyle = c.c; ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
            });

            // Striker
            if (striker.active) {
                ctx.beginPath(); ctx.arc(striker.x, striker.y, striker.r, 0, Math.PI * 2);
                ctx.fillStyle = striker.c; ctx.fill();
                ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2.5; ctx.stroke();
            }

            // Aim Line when dragging
            if (isDragging) {
                ctx.strokeStyle = 'rgba(250, 204, 21, 0.8)';
                ctx.lineWidth = 3;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(striker.x, striker.y);
                let dx = dragCurrentX - startX;
                let dy = dragCurrentY - startY;
                ctx.lineTo(striker.x + dx * 1.5, striker.y + dy * 1.5);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function gameLoop() {
            updatePhysics();
            drawBoard();
            requestAnimationFrame(gameLoop);
        }

        resetBoard();
        gameLoop();
    </script>
</body>
</html>
