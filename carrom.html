<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat Carrom Pro - Local 2-Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100vw; height: 100vh; background: radial-gradient(circle, #581c87 0%, #3b0764 100%, #1e1b4b 100%); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 8px 0; }

        /* Top HUD / Player Cards */
        .hud-top { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; z-index: 10; }
        .match-badge { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #c4b5fd; background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 10px; text-align: center; width: 100%; max-width: 420px; margin-bottom: 2px; border: 1px solid rgba(255,255,255,0.08); }
        
        .player-card { display: flex; align-items: center; gap: 8px; background: rgba(15, 23, 42, 0.6); padding: 5px 10px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); min-width: 125px; transition: all 0.3s ease; }
        .player-card.active-turn { border-color: #facc15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); background: rgba(250, 204, 21, 0.15); }
        
        .avatar-wrap { position: relative; width: 34px; height: 34px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; border: 2px solid #facc15; }
        .avatar-wrap i { font-size: 14px; color: #f8fafc; }
        .level-badge { position: absolute; bottom: -3px; right: -3px; background: #ca8a04; color: #000; font-size: 8px; font-weight: 900; padding: 1px 3px; border-radius: 6px; border: 1px solid #fff; }

        .player-info { display: flex; flex-direction: column; }
        .player-name { font-size: 11px; font-weight: 900; color: #f3f4f6; }
        .player-score { font-size: 10px; color: #facc15; font-weight: 800; display: flex; align-items: center; gap: 3px; }
        
        .turn-banner { background: rgba(0,0,0,0.4); border: 1px solid rgba(250, 204, 21, 0.3); padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: 900; color: #facc15; text-align: center; }

        /* Board Container */
        .board-container { position: relative; width: 90vw; height: 90vw; max-width: 360px; max-height: 360px; display: flex; align-items: center; justify-content: center; }
        canvas { background: #deb887; border: 16px solid #451a03; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.3); width: 100%; height: 100%; }

        /* Bottom Controls / Star Badge Slider */
        .hud-bottom { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; z-index: 10; }
        .striker-control-bar { width: 85%; max-width: 300px; height: 36px; background: rgba(0,0,0,0.5); border-radius: 18px; border: 1px solid rgba(255,255,255,0.15); position: relative; display: flex; align-items: center; padding: 0 12px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
        
        /* Star Badge Slider Knob */
        .control-knob { position: absolute; width: 30px; height: 30px; background: radial-gradient(circle, #ef4444 0%, #b91c1c 100%); border-radius: 50%; top: 3px; left: calc(50% - 15px); cursor: pointer; border: 2px solid #facc15; box-shadow: 0 2px 6px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; color: #facc15; font-size: 12px; }

        .action-buttons { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; }
        .btn-icon { width: 40px; height: 40px; background: radial-gradient(circle, #facc15 0%, #ca8a04 100%); border: none; border-radius: 50%; color: #000; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #fef08a; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn-icon:active { transform: scale(0.92); }

        /* Toast Popup */
        #toast { position: fixed; top: 75px; left: 50%; transform: translateX(-50%) translateY(-30px); background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(250, 204, 21, 0.5); color: #fef08a; padding: 8px 16px; border-radius: 16px; font-size: 11px; font-weight: 800; z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Win Modal */
        #winModal { position: fixed; inset: 0; background: rgba(10, 5, 20, 0.9); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .win-card { background: #2e1065; width: 100%; max-width: 320px; border-radius: 24px; padding: 24px; border: 2px solid #facc15; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .btn-restart { width: 100%; padding: 14px; border-radius: 12px; font-size: 13px; font-weight: 900; cursor: pointer; border: none; background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%); color: #000; text-transform: uppercase; margin-top: 15px; border: 1px solid #fef08a; }
    </style>
</head>
<body>

    <div id="toast">Foul: Striker pocketed!</div>

    <div class="hud-top">
        <div class="match-badge">Local Match · First to clear wins</div>
    </div>

    <div class="hud-top">
        <div class="player-card active-turn" id="p1Card">
            <div class="avatar-wrap">
                <i class="fa-solid fa-user-ninja"></i>
                <span class="level-badge">12</span>
            </div>
            <div class="player-info">
                <span class="player-name">Player 1</span>
                <span class="player-score"><i class="fa-solid fa-circle" style="color:#fdfbf7; font-size:8px;"></i> <span id="p1Count">9</span> left</span>
            </div>
        </div>
        <div class="turn-banner" id="turnBanner">P1's Turn</div>
        <div class="player-card" id="p2Card">
            <div class="avatar-wrap" style="border-color:#3b82f6;">
                <i class="fa-solid fa-user-astronaut"></i>
                <span class="level-badge" style="background:#2563eb; color:#fff;">10</span>
            </div>
            <div class="player-info">
                <span class="player-name">Player 2</span>
                <span class="player-score"><i class="fa-solid fa-circle" style="color:#1e293b; font-size:8px;"></i> <span id="p2Count">9</span> left</span>
            </div>
        </div>
    </div>

    <div class="board-container">
        <canvas id="carromCanvas" width="400" height="400"></canvas>
    </div>

    <div class="hud-bottom">
        <div class="striker-control-bar" id="sliderBar">
            <div class="control-knob" id="controlKnob"><i class="fa-solid fa-star" style="font-size:10px;"></i></div>
        </div>
        <div class="action-buttons">
            <button class="btn-icon" onclick="resetBoard()" title="Restart Match"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="btn-icon" style="background:radial-gradient(circle, #ef4444 0%, #b91c1c 100%); color:#fff; border-color:#fca5a5;" onclick="quitToHome()" title="Exit Match"><i class="fa-solid fa-power-off"></i></button>
            <button class="btn-icon" onclick="toggleSound()" id="soundBtn" title="Toggle Sound"><i class="fa-solid fa-volume-high"></i></button>
        </div>
    </div>

    <div id="winModal">
        <div class="win-card">
            <i class="fa-solid fa-trophy" style="font-size: 48px; color: #facc15; margin-bottom: 12px;"></i>
            <h2 id="winTitle" style="font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 8px;">Player 1 Wins!</h2>
            <p id="winDesc" style="font-size: 11px; color: #cbd5e1; margin-bottom: 15px;">All coins successfully pocketed and covered.</p>
            <button class="btn-restart" onclick="resetBoard()">Play Again</button>
        </div>
    </div>

    <script>
        // --- Web Audio API Sound Synthesizer ---
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
                osc.start(); osc.stop(audioCtx.currentTime + 0.06);
            } else if (type === 'pocket') {
                osc.frequency.setValueAtTime(320, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'shoot') {
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        function quitToHome() {
            window.parent.postMessage({ sender: 'syncbeat', action: 'ROOM_CLOSED' }, '*');
        }

        // --- Game State & Physics Engine ---
        const cvs = document.getElementById('carromCanvas');
        const ctx = cvs.getContext('2d');

        let coins = [];
        let striker = { id: 'striker', c: '#fffbeb', x: 200, y: 310, r: 13, vx: 0, vy: 0, mass: 1.8, active: true };
        
        let turn = 1; 
        let p1Score = 9;
        let p2Score = 9;
        let queenCoverNeeded = false;
        let shotTaken = false;
        let pocketedThisShot = [];

        function resetBoard() {
            document.getElementById('winModal').style.display = 'none';
            turn = 1; p1Score = 9; p2Score = 9; queenCoverNeeded = false;
            updateHUD();
            initPieces();
        }

        function initPieces() {
            coins = [{ id: 'queen', c: '#dc2626', x: 200, y: 200, r: 9, vx: 0, vy: 0, mass: 1, active: true, type: 'queen' }];
            
            // Inner Hex Ring (6 coins)
            for (let i = 0; i < 6; i++) {
                let angle = i * (Math.PI / 3);
                let type = i % 2 === 0 ? 'white' : 'black';
                let color = type === 'white' ? '#fdfbf7' : '#1e293b';
                coins.push({ id: `inner_${i}`, c: color, x: 200 + Math.cos(angle)*19, y: 200 + Math.sin(angle)*19, r: 9, vx: 0, vy: 0, mass: 1, active: true, type: type });
            }

            // Outer Hex Ring (12 coins rotated by 15 degrees, 360 full loop)
            for (let i = 0; i < 12; i++) {
                let angle = i * (Math.PI / 6) + (Math.PI / 12);
                let type = i % 2 === 0 ? 'black' : 'white';
                let color = type === 'white' ? '#fdfbf7' : '#1e293b';
                coins.push({ id: `outer_${i}`, c: color, x: 200 + Math.cos(angle)*40, y: 200 + Math.sin(angle)*40, r: 9, vx: 0, vy: 0, mass: 1, active: true, type: type });
            }
            resetStriker();
        }

        function resetStriker() {
            striker.x = 200;
            striker.y = turn === 1 ? 310 : 90;
            striker.vx = 0; striker.vy = 0;
            striker.active = true;
            document.getElementById('controlKnob').style.left = 'calc(50% - 15px)';
        }

        function updateHUD() {
            document.getElementById('p1Count').innerText = p1Score;
            document.getElementById('p2Count').innerText = p2Score;
            const p1Card = document.getElementById('p1Card');
            const p2Card = document.getElementById('p2Card');
            const banner = document.getElementById('turnBanner');

            if (turn === 1) {
                p1Card.classList.add('active-turn');
                p2Card.classList.remove('active-turn');
                banner.innerText = "P1's Turn (White)";
            } else {
                p2Card.classList.add('active-turn');
                p1Card.classList.remove('active-turn');
                banner.innerText = "P2's Turn (Black)";
            }
        }

        // --- Baseline Slider Controls ---
        const sliderBar = document.getElementById('sliderBar');
        const knob = document.getElementById('controlKnob');
        let isSliding = false;

        sliderBar.addEventListener('pointerdown', (e) => { isSliding = true; updateStrikerPos(e); });
        window.addEventListener('pointermove', (e) => { if (isSliding) updateStrikerPos(e); });
        window.addEventListener('pointerup', () => isSliding = false);

        function updateStrikerPos(e) {
            if (isMoving()) return;
            const rect = sliderBar.getBoundingClientRect();
            let pos = (e.clientX - rect.left) / rect.width;
            pos = Math.max(0.1, Math.min(0.9, pos));
            knob.style.left = `calc(${pos * 100}% - 15px)`;
            striker.x = 120 + pos * 160;
        }

        // --- Slingshot Aim & Shoot ---
        let isDragging = false;
        let startX, startY;
        let dragCurrentX, dragCurrentY;

        cvs.addEventListener('pointerdown', (e) => {
            if (isMoving()) return;
            const rect = cvs.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (cvs.width / rect.width);
            const clickY = (e.clientY - rect.top) * (cvs.height / rect.height);
            
            if (Math.hypot(clickX - striker.x, striker.y - clickY) < 30) {
                isDragging = true;
                startX = clickX; startY = clickY;
                dragCurrentX = clickX; dragCurrentY = clickY;
            }
        });

        cvs.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const rect = cvs.getBoundingClientRect();
            dragCurrentX = (e.clientX - rect.left) * (cvs.width / rect.width);
            dragCurrentY = (e.clientY - rect.top) * (cvs.height / rect.height);
        });

        cvs.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;
            
            let dx = dragCurrentX - startX;
            let dy = dragCurrentY - startY;
            let power = Math.hypot(dx, dy);
            if (power > 5) {
                let maxPower = 120;
                let scale = Math.min(power, maxPower) / maxPower;
                striker.vx = (-dx / power) * scale * 18;
                striker.vy = (-dy / power) * scale * 18;
                shotTaken = true;
                pocketedThisShot = [];
                playSound('shoot');
            }
        });

        function isMoving() {
            if (Math.abs(striker.vx) > 0.02 || Math.abs(striker.vy) > 0.02) return true;
            for (let c of coins) {
                if (c.active && (Math.abs(c.vx) > 0.02 || Math.abs(c.vy) > 0.02)) return true;
            }
            return false;
        }

        // --- Physics & Collisions ---
        function resolveCollision(a, b) {
            if (!a.active || !b.active) return;
            let dx = b.x - a.x; let dy = b.y - a.y; let dist = Math.hypot(dx, dy);
            if (dist < a.r + b.r) {
                let overlap = (a.r + b.r - dist) / 2;
                let nx = dx / dist, ny = dy / dist;
                a.x -= nx * overlap; a.y -= ny * overlap;
                b.x += nx * overlap; b.y += ny * overlap;
                let kx = b.vx - a.vx; let ky = b.vy - a.vy;
                let p = 2 * (nx * kx + ny * ky) / (a.mass + b.mass);
                a.vx += p * b.mass * nx; a.vy += p * b.mass * ny;
                b.vx -= p * a.mass * nx; b.vy -= p * a.mass * ny;
                playSound('hit');
            }
        }

        const pockets = [[22,22], [378,22], [22,378], [378,378]];

        function updatePhysics() {
            if (Math.abs(striker.vx) > 0.01 || Math.abs(striker.vy) > 0.01) {
                striker.vx *= 0.982; striker.vy *= 0.982;
                striker.x += striker.vx; striker.y += striker.vy;
                if (striker.x < striker.r + 6 || striker.x > cvs.width - striker.r - 6) { striker.vx *= -0.75; striker.x = Math.max(striker.r + 6, Math.min(cvs.width - striker.r - 6, striker.x)); playSound('hit'); }
                if (striker.y < striker.r + 6 || striker.y > cvs.height - striker.r - 6) { striker.vy *= -0.75; striker.y = Math.max(striker.r + 6, Math.min(cvs.height - striker.r - 6, striker.y)); playSound('hit'); }
            }

            for (let i = 0; i < coins.length; i++) {
                let c = coins[i];
                if (!c.active) continue;
                if (Math.abs(c.vx) > 0.01 || Math.abs(c.vy) > 0.01) {
                    c.vx *= 0.982; c.vy *= 0.982;
                    c.x += c.vx; c.y += c.vy;
                    if (c.x < c.r + 6 || c.x > cvs.width - c.r - 6) { c.vx *= -0.75; c.x = Math.max(c.r + 6, Math.min(cvs.width - c.r - 6, c.x)); playSound('hit'); }
                    if (c.y < c.r + 6 || c.y > cvs.height - c.r - 6) { c.vy *= -0.75; c.y = Math.max(c.r + 6, Math.min(cvs.height - c.r - 6, c.y)); playSound('hit'); }
                }
                resolveCollision(striker, c);
                for (let j = i + 1; j < coins.length; j++) resolveCollision(c, coins[j]);
            }

            coins.forEach(c => {
                if (!c.active) return;
                pockets.forEach(p => {
                    if (Math.hypot(c.x - p[0], c.y - p[1]) < 16) {
                        c.active = false; c.vx = 0; c.vy = 0;
                        pocketedThisShot.push(c);
                        playSound('pocket');
                    }
                });
            });

            pockets.forEach(p => {
                if (striker.active && Math.hypot(striker.x - p[0], striker.y - p[1]) < 18) {
                    striker.active = false;
                    striker.vx = 0; striker.vy = 0;
                    showToast("Foul: Striker pocketed!");
                    playSound('pocket');
                }
            });

            if (shotTaken && !isMoving()) {
                resolveTurn();
            }
        }

        function resolveTurn() {
            shotTaken = false;
            let keepTurn = false;
            let foul = !striker.active;

            if (!striker.active) {
                pocketedThisShot.forEach(pc => {
                    if (pc.type === (turn === 1 ? 'white' : 'black')) {
                        pc.active = true;
                        pc.x = 200; pc.y = 200;
                    }
                });
            } else {
                pocketedThisShot.forEach(pc => {
                    if (pc.type === 'white') {
                        if (turn === 1) { p1Score--; keepTurn = true; }
                        else { p2Score--; }
                    } else if (pc.type === 'black') {
                        if (turn === 2) { p2Score--; keepTurn = true; }
                        else { p1Score--; }
                    } else if (pc.type === 'queen') {
                        queenCoverNeeded = true;
                        showToast("Queen pocketed! Must cover next.");
                        keepTurn = true;
                    }
                });

                if (queenCoverNeeded && pocketedThisShot.length > 0) {
                    let covered = pocketedThisShot.some(pc => pc.type === (turn === 1 ? 'white' : 'black'));
                    if (covered) {
                        queenCoverNeeded = false;
                        showToast("Queen covered successfully!");
                    }
                }
            }

            resetStriker();

            if (p1Score <= 0) {
                document.getElementById('winTitle').innerText = "Player 1 Wins!";
                document.getElementById('winModal').style.display = 'flex';
                return;
            } else if (p2Score <= 0) {
                document.getElementById('winTitle').innerText = "Player 2 Wins!";
                document.getElementById('winModal').style.display = 'flex';
                return;
            }

            if (!keepTurn || foul) {
                turn = turn === 1 ? 2 : 1;
            }
            updateHUD();
        }

        // --- Canvas Rendering with Pool-Style Visuals ---
        function drawBoard() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            // Inset Gold Trim Border
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 3;
            ctx.strokeRect(10, 10, cvs.width - 20, cvs.height - 20);

            // Edge Studs (Gold dot markers)
            ctx.fillStyle = '#fef08a';
            for (let i = 50; i < cvs.width; i += 75) {
                ctx.beginPath(); ctx.arc(i, 10, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i, cvs.height - 10, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(10, i, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cvs.width - 10, i, 2.5, 0, Math.PI*2); ctx.fill();
            }

            // Black Corner Wedges behind Pockets
            ctx.fillStyle = '#09090b';
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(45, 0); ctx.lineTo(0, 45); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cvs.width, 0); ctx.lineTo(cvs.width - 45, 0); ctx.lineTo(cvs.width, 45); ctx.fill();
            ctx.beginPath(); ctx.moveTo(0, cvs.height); ctx.lineTo(45, cvs.height); ctx.lineTo(0, cvs.height - 45); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cvs.width, cvs.height); ctx.lineTo(cvs.width - 45, cvs.height); ctx.lineTo(cvs.width, cvs.height - 45); ctx.fill();

            // Pockets (Gold ring + dark hole)
            pockets.forEach(p => {
                ctx.beginPath(); ctx.arc(p[0], p[1], 18, 0, Math.PI*2);
                let grad = ctx.createRadialGradient(p[0], p[1], 5, p[0], p[1], 18);
                grad.addColorStop(0, '#000000');
                grad.addColorStop(0.8, '#18181b');
                grad.addColorStop(1, '#eab308');
                ctx.fillStyle = grad; ctx.fill();
                ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 1.5; ctx.stroke();
            });

            // Center Rosette / Mandala Art
            ctx.beginPath(); ctx.arc(200, 200, 42, 0, Math.PI*2); ctx.strokeStyle = 'rgba(92, 58, 33, 0.3)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(200, 200, 14, 0, Math.PI*2); ctx.fillStyle = 'rgba(92, 58, 33, 0.25)'; ctx.fill();

            // Baseline Striker Badges (Star Target Badge)
            [ [200, 310], [200, 90] ].forEach(b => {
                ctx.beginPath(); ctx.arc(b[0], b[1], 18, 0, Math.PI*2);
                ctx.fillStyle = '#dc2626'; ctx.fill();
                ctx.strokeStyle = '#eab308'; ctx.lineWidth = 1.5; ctx.stroke();
            });

            // Coins with gloss radial gradients
            coins.forEach(c => {
                if (!c.active) return;
                ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                let grad = ctx.createRadialGradient(c.x - 3, c.y - 3, 1, c.x, c.y, c.r);
                if (c.type === 'queen') {
                    grad.addColorStop(0, '#f87171'); grad.addColorStop(1, '#b91c1c');
                } else if (c.type === 'white') {
                    grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#cbd5e1');
                } else {
                    grad.addColorStop(0, '#475569'); grad.addColorStop(1, '#0f172a');
                }
                ctx.fillStyle = grad; ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
            });

            // Striker (Ivory/gold gradient with thick rim)
            if (striker.active) {
                ctx.beginPath(); ctx.arc(striker.x, striker.y, striker.r, 0, Math.PI * 2);
                let sGrad = ctx.createRadialGradient(striker.x - 3, striker.y - 3, 2, striker.x, striker.y, striker.r);
                sGrad.addColorStop(0, '#fffbeb'); sGrad.addColorStop(1, '#fde047');
                ctx.fillStyle = sGrad; ctx.fill();
                ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2.5; ctx.stroke();
            }

            // Aim Line & Dynamic Power Rings when dragging
            if (isDragging) {
                let dx = dragCurrentX - startX;
                let dy = dragCurrentY - startY;
                let power = Math.hypot(dx, dy);

                ctx.strokeStyle = power > 80 ? 'rgba(239, 68, 68, 0.9)' : 'rgba(250, 204, 21, 0.9)';
                ctx.lineWidth = Math.min(6, 2 + power / 20);
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(striker.x, striker.y);
                ctx.lineTo(striker.x + dx * 1.5, striker.y + dy * 1.5);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function gameLoop() {
            updatePhysics();
            drawBoard();
            requestAnimationFrame(gameLoop);
        }

        resetBoard();
        gameLoop();
    </script>
</body>
</html>
